name: n+ 每日签到（打火器）

# 这个 workflow 已经退化成一个「打火器」：它只负责按点敲一下 Cloudflare Worker
#
#     curl https://south-sign.sony-fans.workers.dev/sign
#
# 真正的签到请求是从 **Cloudflare 边缘**发出的，不是从 GitHub 机房发出的。所以：
#   · 不需要任何 secret（Cookie 和 UA 都存在 Worker 的加密变量里）
#   · 不会再遇到前面那轮「Cloudflare 把 GitHub 机房 IP 挡在挑战页外」的问题
#   · 也不会遇到会话绑定问题（UA 已固定为抓 Cookie 那个浏览器的真实 UA）
#
# 之所以用 Actions 而不是 Worker 原生 Cron：账户免费版的 5 个 cron 名额已被
# 别的 Worker 占满（10072 报错）。
#
# Bark 推送由 Worker 侧发出（见 cloudflare-worker/sign-worker.js 的 notifyBark），
# 设备地址存在 Worker 的加密变量 BARK 里，不在这个公开仓库中。所以这里不需要
# 任何 secret，通知也会随签到结果一起送达。

on:
  schedule:
    # 01:23 UTC = 北京时间 09:23。避开整点，那是 GitHub 定时任务最拥堵的时段。
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-sign.yml"

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 敲一下 Cloudflare Worker
        run: |
          set -o pipefail
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 180 \
            -H 'Accept: application/json' \
            "https://south-sign.sony-fans.workers.dev/sign")
          echo "HTTP $code"
          echo "----- Worker 返回 -----"
          cat resp.json
          echo
          echo "-----------------------"
          if [ "$code" != "200" ] || ! grep -q '"ok": true' resp.json; then
            echo "::error::签到未成功，检查 Worker 的 COOKIE / UA 变量，或 Cookie 是否失效"
            exit 1
          fi
          echo "签到成功"
