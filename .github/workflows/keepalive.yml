name: 保活

# GitHub 会在「仓库 60 天没有任何活动」后自动停用定时任务，然后给仓库所有者发一封邮件。
# 这个工作流每月提交一次时间戳，把计时器顶回去。
#
# ⚠️ 定时已停用（2026-09-30）：本仓库唯一的定时任务 daily-sign 已改为手动触发
# （签到挪到 NAS 的青龙面板），所以「防止定时任务被 GitHub 停用」这件事不再有意义，
# 留着只会每月往仓库里多一个无意义的提交。
#
# 说明白一点：由 GITHUB_TOKEN 发起的提交算不算「仓库活动」，官方文档没写死，
# 社区里两种经验都有。所以别把它当保险。
#
# 如果将来又需要仓库内的定时任务（比如把 daily-sign 的 schedule 加回来），
# 把下面 schedule 段取消注释即可。

on:
  # schedule:
  #   - cron: "17 3 1 * *"     # 每月 1 号 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 写入保活时间戳
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 保活 $(date -u +%F)"
            git push
          fi
